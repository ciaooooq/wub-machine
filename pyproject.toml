[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wub-machine"
version = "2.0.0a1"
description = "Modern, open-source automatic music remixer inspired by The Wub Machine"
readme = "Readme.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Peter Sobot and contributors"}]
dependencies = []

[project.optional-dependencies]
analysis = [
    "librosa>=0.11",
    "soundfile>=0.13",
]
dev = [
    "pytest>=8",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
include = ["wubmachine*"]
